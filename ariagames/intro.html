<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARIAgames intro</title>
<style>
:root{--red:#e50914;--ink:#0a0a0a;--paper:#f6f4f0}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Helvetica,Arial,sans-serif}
#stage{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;overflow:hidden;animation:out .5s 4.5s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(1.06)}}
/* curtains: dark halves that open from a red line */
.cur{position:absolute;left:0;right:0;height:50%;background:var(--ink);z-index:5}
.cur.t{top:0;transform-origin:top;animation:ct .7s .55s cubic-bezier(.7,0,.2,1) forwards}
.cur.b{bottom:0;transform-origin:bottom;animation:ct .7s .55s cubic-bezier(.7,0,.2,1) forwards}
@keyframes ct{to{transform:scaleY(0)}}
.line{position:absolute;left:50%;top:50%;height:3px;width:0;background:var(--red);z-index:6;transform:translate(-50%,-50%);box-shadow:0 0 24px 6px rgba(229,9,20,.9),0 0 90px 20px rgba(229,9,20,.5);animation:ln .55s cubic-bezier(.2,.8,.2,1) forwards,lf .2s .6s forwards}
@keyframes ln{to{width:100%}}@keyframes lf{to{opacity:0}}
/* wordmark */
.word{position:relative;z-index:3;display:flex;align-items:baseline;font-size:min(13.5vw,176px);font-weight:900;font-style:italic;letter-spacing:-.045em;line-height:1;animation:shake .35s 1.45s ease-out}
@keyframes shake{20%{transform:translate(-6px,4px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.aria{display:flex;color:var(--red)}
.aria span{display:inline-block;opacity:0;transform:translateY(-120vh) skewX(-12deg);animation:drop .55s cubic-bezier(.3,1.5,.5,1) forwards;text-shadow:0 12px 0 rgba(229,9,20,.12)}
.aria span:nth-child(1){animation-delay:1.0s}.aria span:nth-child(2){animation-delay:1.1s}.aria span:nth-child(3){animation-delay:1.2s}.aria span:nth-child(4){animation-delay:1.3s}
@keyframes drop{0%{opacity:1;transform:translateY(-120vh) skewX(-12deg) scaleY(1.6)}70%{opacity:1}100%{opacity:1;transform:none}}
.games{color:var(--ink);font-weight:800;font-style:normal;letter-spacing:-.04em;margin-left:.06em;opacity:0;transform:translateX(30vw);filter:blur(24px);animation:slide .8s 1.75s cubic-bezier(.16,1,.3,1) forwards}
@keyframes slide{to{opacity:1;transform:none;filter:blur(0)}}
/* shockwave */
.ring{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;border:3px solid var(--red);transform:translate(-50%,-50%) scale(0);opacity:0;z-index:2;animation:ring .9s 1.35s cubic-bezier(.1,.7,.3,1) forwards}
.ring.r2{animation-delay:1.5s;border-width:1.5px}
@keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(140)}}
/* speed streaks */
.streak{position:absolute;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:0;z-index:1;animation:st .7s ease-out forwards}
@keyframes st{0%{opacity:0;transform:translateX(-40vw)}30%{opacity:.8}100%{opacity:0;transform:translateX(60vw)}}
/* underline + shine */
.bar{position:absolute;z-index:3;left:50%;top:calc(50% + min(11.5vw,150px));height:5px;width:0;background:var(--ink);transform:translateX(-50%);animation:bar .7s 2.45s cubic-bezier(.2,.9,.2,1) forwards}
.bar::after{content:"";position:absolute;right:0;top:0;width:18%;height:100%;background:var(--red)}
@keyframes bar{to{width:min(62vw,800px)}}
.shine{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);transform:translateX(-120%);animation:sh .9s 2.6s ease-in-out forwards;mix-blend-mode:overlay}
@keyframes sh{to{transform:translateX(120%)}}
.tag{position:absolute;z-index:3;left:0;right:0;top:calc(50% + min(14.5vw,185px));text-align:center;font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.42em;text-transform:uppercase;color:#6b6762;opacity:0;animation:tg .7s 3.1s forwards}
@keyframes tg{to{opacity:1}}
/* pixel burst */
.px{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);background:var(--c);z-index:4;opacity:0;animation:px 1s var(--d) cubic-bezier(.1,.8,.3,1) forwards}
@keyframes px{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
</style></head><body>
<div id="stage">
 <div class="cur t"></div><div class="cur b"></div><div class="line"></div>
 <div class="ring"></div><div class="ring r2"></div>
 <div class="word"><div class="aria"><span>A</span><span>R</span><span>I</span><span>A</span></div><div class="games">games</div></div>
 <div class="bar"></div><div class="shine"></div>
 <div class="tag">Big games · Tiny screen</div>
</div>
<script>
const st=document.getElementById('stage');
// speed streaks
for(let i=0;i<14;i++){const e=document.createElement('i');e.className='streak';
 e.style.cssText=`top:${8+Math.random()*84}%;left:${Math.random()*50}%;width:${20+Math.random()*40}vw;animation-delay:${1.0+Math.random()*.5}s`;st.appendChild(e)}
// pixel burst when games lands
for(let i=0;i<34;i++){const e=document.createElement('i');e.className='px';
 const a=Math.random()*6.283,d=18+Math.random()*34;
 e.style.cssText=`--s:${4+Math.random()*9}px;--c:${Math.random()<.6?'#e50914':'#0a0a0a'};--x:${Math.cos(a)*d}vw;--y:${Math.sin(a)*d*.7}vh;--r:${Math.random()*540}deg;--d:${2.2+Math.random()*.25}s`;
 st.appendChild(e)}
setTimeout(()=>{try{parent.postMessage('aria-intro-done','*')}catch(e){}},5000);
st.addEventListener('click',()=>location.reload());
</script></body></html>
