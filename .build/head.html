<style>
:root{

/* ---- Modo claro: paleta Pinterest de la app (rojo #E60023 sobre blanco galeria, greige neutro, acentos de igual peso) ---- */
:root[data-theme="light"]{
  --bg:#FAFAF8; --bg2:#F3F2EF; --panel:#FFFFFF; --panel2:#F2F1EF; --line:#E5E3DF; --line2:#D4D1CB;
  --ink:#141216; --ink2:#55525C; --ink3:#8A878F;
  --cyan:#E60023; --cyan-ink:#98001A; --glow:rgba(230,0,35,.14);
  --c1:#E60023; --c2:#C05621; --c3:#00795C; --c4:#6236D6; --c5:#A66200; --c6:#0A66C2;
  --paper:#FFFDF9; --paper-ink:#141216;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Helvetica Neue",Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="en"] .es{display:none!important} html[lang="es"] .en{display:none!important}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.015em;margin:0;text-wrap:balance;line-height:1.06}
h1{font-size:clamp(2.7rem,6.4vw,5rem);font-variation-settings:"opsz" 144}
h2{font-size:clamp(1.9rem,3.8vw,3rem)}
h3{font-size:1.1rem;line-height:1.25}

.lead{color:var(--ink2);font-size:1.1rem;max-width:32rem}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent,var(--cyan))}
a{color:var(--cyan-ink)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
/* nav + spectrum hairline */
nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 76%,transparent);border-bottom:1px solid var(--line)}
nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--c1),var(--c6),var(--c4),var(--c2),var(--c5),var(--c3));opacity:.85}
nav .wrap{display:flex;align-items:center;gap:22px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-decoration:none;font-size:1.05rem}
.brand img{width:28px;height:28px;border-radius:8px}
.brand b{color:var(--c1);font-weight:700}
nav .links{display:flex;gap:20px;margin-left:auto;font-size:.9rem}
nav .links a{color:var(--ink2);text-decoration:none;position:relative}
nav .links a:hover{color:var(--ink)}
nav .links a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--accent,var(--c1));transform:scaleX(0);transition:transform .2s}
nav .links a:hover::after{transform:scaleX(1)}
.lang{border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font:600 .78rem "JetBrains Mono",monospace;cursor:pointer;letter-spacing:.1em}
@media(max-width:760px){nav .links{display:none}}
/* 3D stage */
.stage{position:relative;height:320vh}
.stage-in{position:sticky;top:0;height:100vh;overflow:hidden}
#three{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage-ui{position:relative;height:100%;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;pointer-events:none}
.stage-ui .copy{pointer-events:auto;position:relative;z-index:2}
.stage-ui .copy h1 em{font-style:italic;font-weight:300;background:linear-gradient(100deg,var(--c1),var(--c4) 55%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.scrollhint{margin-top:30px;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.phone{justify-self:center;width:min(300px,74vw);border-radius:44px;padding:10px;background:#0a0d14;border:1px solid #2a3442;box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 120px -20px var(--glow)}
.phone img{display:block;width:100%;border-radius:36px}
.phone.fallback{display:none}
.no3d #three{display:none}.no3d .phone.fallback{display:block}.no3d .stage{height:auto;padding:70px 0 30px}.no3d .stage-in{position:static;height:auto;overflow:visible}.no3d .actcap{display:none}.no3d .scrollhint{display:none}
.actcap{position:absolute;left:0;right:0;bottom:6vh;height:110px;text-align:center;z-index:2}
.actcap .cap{position:absolute;left:0;right:0;opacity:0;transition:opacity .35s}
.actcap .cap.on{opacity:1}
.actcap h2{font-size:clamp(1.6rem,3vw,2.4rem)}
.actcap h2 span{color:var(--accent,var(--ink))}
.actcap p{color:var(--ink2);margin-top:6px;font-size:.98rem}
.badge img{height:52px;display:block}.badge{display:inline-block;margin:0 6px 0 0}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:14px;font-weight:700;text-decoration:none;font-size:.95rem;border:1px solid transparent;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line2);color:var(--ink)}
.chips{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.chips span{font-family:"JetBrains Mono",monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);border-radius:999px;padding:6px 12px}
.chips i{width:6px;height:6px;border-radius:50%;background:var(--k);box-shadow:0 0 10px var(--k)}
@media(max-width:860px){.stage-ui{grid-template-columns:1fr;align-items:start;padding-top:36px}h1{font-size:2.4rem}.lead{font-size:1rem}.chips{display:none}.actcap{bottom:4vh}}
/* sections */
section{padding:96px 0;position:relative}
.sec-head{max-width:44rem;margin-bottom:44px}
.sec-head h2{margin-top:12px}
.sec-head .lead{margin-top:14px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.b{--k:var(--c1);grid-column:span 2;border:1px solid var(--line);border-radius:22px;padding:26px;background:
   radial-gradient(120% 100% at 0% 0%, color-mix(in srgb,var(--k) 12%,transparent) 0%, transparent 62%), var(--panel);
   position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.b:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--k) 45%,var(--line))}
.b .k{font-family:"JetBrains Mono",monospace;font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;color:var(--k)}
.b h3{margin-top:16px;color:var(--ink);font-size:1.32rem}
.b p{margin-top:9px;color:var(--ink2);font-size:.95rem;line-height:1.5}
.b .dot{position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--k);opacity:.10;filter:blur(28px)}
.b.wide{grid-column:span 3}
.b.tall{grid-column:span 3}
@media(max-width:900px){.bento{grid-template-columns:repeat(2,1fr)}.b,.b.wide,.b.tall{grid-column:span 2}}
/* daily */
.daily{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c2) 6%,transparent),transparent)}
.daily .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
@media(max-width:900px){.daily .wrap{grid-template-columns:1fr;gap:34px}}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:30px 28px;border:1px solid var(--line);box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
.paper .mast{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;opacity:.6;border-bottom:1px solid color-mix(in srgb,var(--paper-ink) 18%,transparent);padding-bottom:8px}
.paper .title{font-family:Fraunces,Georgia,serif;font-size:2.4rem;text-align:center;margin:16px 0 4px;letter-spacing:.02em}
.paper .dt{text-align:center;font-size:.72rem;opacity:.6;border-bottom:2px solid color-mix(in srgb,var(--paper-ink) 20%,transparent);padding-bottom:12px}
.paper h4{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.28rem;margin:18px 0 8px;line-height:1.2}
.paper .first{font-size:.9rem;opacity:.82;line-height:1.55}
.paper .tag{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid;border-radius:999px;padding:3px 9px;margin:14px 6px 0 0}
/* ledger */
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.ledger div{border:1px solid var(--line);border-radius:18px;padding:24px 20px;background:var(--panel);text-align:center}
.ledger .n{font-family:Fraunces,Georgia,serif;font-size:clamp(2.4rem,5vw,3.6rem);line-height:1;color:var(--k)}
.ledger .l{font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-top:10px}
@media(max-width:700px){.ledger{grid-template-columns:repeat(2,1fr)}}
.plist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.plist div{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:16px 2px}
.plist b{color:var(--k);font-family:"JetBrains Mono",monospace;font-size:.7rem;letter-spacing:.1em;flex:none;margin-top:3px}
.plist p{color:var(--ink2);font-size:.93rem}
.plist p em{font-style:normal;color:var(--ink);font-weight:600}
@media(max-width:800px){.plist{grid-template-columns:1fr}}
/* pricing */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
@media(max-width:800px){.plans{grid-template-columns:1fr}}
.plan{border:1px solid var(--line);border-radius:22px;padding:30px;background:var(--panel);position:relative;overflow:hidden}
.plan.hi{--k:var(--c5);border-color:color-mix(in srgb,var(--c5) 40%,var(--line));background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c5) 13%,transparent),transparent 60%),var(--panel)}
.plan .name{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--k,var(--ink3))}
.plan .price{font-family:Fraunces,Georgia,serif;font-size:2.5rem;margin-top:12px;line-height:1}
.plan .price small{font-size:.85rem;font-family:Manrope,sans-serif;color:var(--ink3)}
.plan ul{list-style:none;padding:0;margin:20px 0 0}
.plan li{padding:9px 0 9px 26px;position:relative;color:var(--ink2);font-size:.94rem;border-top:1px solid var(--line)}
.plan li::before{content:"";position:absolute;left:4px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--k,var(--ink3))}
.plan .note{margin-top:18px;font-size:.8rem;color:var(--ink3)}
/* faq */
details{border-top:1px solid var(--line);padding:18px 0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:"JetBrains Mono",monospace;color:var(--c1);font-size:1.2rem;flex:none}
details[open] summary::after{content:"–"}
details p{color:var(--ink2);margin-top:12px;font-size:.94rem;max-width:60ch}
/* final */
.fin{text-align:center;background:
  radial-gradient(60% 120% at 20% 0%,color-mix(in srgb,var(--c1) 14%,transparent),transparent 70%),
  radial-gradient(60% 120% at 80% 100%,color-mix(in srgb,var(--c5) 12%,transparent),transparent 70%),
  radial-gradient(50% 100% at 50% 50%,color-mix(in srgb,var(--c4) 9%,transparent),transparent 70%);
  border-top:1px solid var(--line)}
.fin .cta{justify-content:center}
footer{border-top:1px solid var(--line);padding:34px 0;color:var(--ink3);font-size:.82rem;background:var(--bg2)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer a{color:var(--ink2);text-decoration:none;margin-left:20px}
footer a:hover{color:var(--ink)}
@media(max-width:700px){section{padding:64px 0}.b{padding:22px}}
.trust{margin-top:20px;font-size:.92rem;color:var(--ink2);max-width:34rem;border-left:2px solid var(--c3);padding-left:14px}
.trust b{color:var(--ink);font-weight:700}
@media(max-width:860px){.trust{font-size:.86rem}}
</style>
